:root{
  --royal:#45305A;--violet:#5E4075;--lav:#9B7FC8;--lilac:#E1D2FF;--snow:#F6F1FF;
  --bg:#120D17;--bg2:#19121F;--panel:#1C1423;--card:#231A2C;--card2:#2C2137;--card3:#372A45;
  --line:rgba(185,160,230,.2);--line2:rgba(185,160,230,.11);
  --ink:#F6F1FF;--ink2:#E1D2FF;--muted:#B7A6CC;--faint:#8C7BA0;
  --accent:#B9A0E6;--accent2:#CFBCF5;--btn:#6B4A85;--btn2:#7A589A;--onbtn:#fff;
  --good:#4CC38A;--warn:#E9B24C;--bad:#F07C8C;
  --shadow:0 18px 44px rgba(5,0,10,.45);--shadow2:0 6px 18px rgba(5,0,10,.35);
  --glow:0 0 0 1px rgba(185,160,230,.35),0 10px 30px rgba(94,64,117,.35);
  --r:18px;--r2:13px;--r3:10px;
  --serif:"Fraunces","Iowan Old Style",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#F6F1FF;--bg2:#EEE5FF;--panel:#FFFFFF;--card:#FFFFFF;--card2:#F8F4FF;--card3:#EDE4FF;
  --line:rgba(94,64,117,.14);--line2:rgba(94,64,117,.08);
  --ink:#2B1D38;--ink2:#45305A;--muted:#6E5E80;--faint:#92849F;
  --accent:#5E4075;--accent2:#45305A;--btn:#5E4075;--btn2:#4F3566;--onbtn:#fff;
  --good:#1F8A52;--warn:#A86A00;--bad:#C2334A;
  --shadow:0 16px 38px rgba(69,48,90,.12);--shadow2:0 4px 14px rgba(69,48,90,.09);
  --glow:0 0 0 1px rgba(94,64,117,.25),0 10px 26px rgba(94,64,117,.18);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14.5px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 600px at 85% -10%,rgba(94,64,117,.35),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(69,48,90,.45),transparent 60%)}
html[data-theme="light"] body::before{background:radial-gradient(900px 600px at 85% -10%,rgba(155,127,200,.22),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(231,219,239,.9),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent2)}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;font-optical-sizing:auto}
svg{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:8px}
::selection{background:rgba(155,127,200,.4)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--card3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh;position:relative;z-index:1}
.side{width:248px;flex:0 0 248px;background:linear-gradient(180deg,var(--panel),var(--bg2));border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px;border-bottom:1px solid var(--line2)}
.brand .mk{width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:radial-gradient(circle at 32% 28%,#C9B3F0,#5E4075 55%,#45305A);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px rgba(69,48,90,.45);display:grid;place-items:center;color:#fff}
.brand .mk img{width:30px;height:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.brand b{display:block;font-family:var(--serif);font-size:18px;line-height:1.05;font-weight:600}
.brand small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9.5px 12px;margin-bottom:2px;border-radius:12px;color:var(--ink2);font-size:14px;font-weight:500;text-align:left;transition:background .15s,color .15s;position:relative}
.nav button .ic{color:var(--muted)}
.nav button:hover{background:var(--card2)}
.nav button.on{background:linear-gradient(135deg,var(--violet),var(--royal));color:#fff;box-shadow:var(--glow)}
.nav button.on .ic{color:#F6F1FF}
.nav .bd{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:20px;background:var(--card3);color:var(--ink2);font-size:11px;font-weight:700;text-align:center}
.nav button.on .bd{background:rgba(255,255,255,.2);color:#fff}
.nav .sep{height:1px;background:var(--line2);margin:8px 6px}
.lvl{margin:10px 12px 14px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.lvl .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lvl .t b{color:var(--ink);font-size:13px}
.bar{height:7px;border-radius:7px;background:var(--card3);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--violet),var(--lav));transition:width .6s}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.top .burger{display:none}
.top h1{font-size:23px;line-height:1.1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.srch{position:relative;width:240px}
.srch input,.srch input[type=search]{width:100%;padding:9px 12px 9px 36px;border-radius:12px;background:var(--card);border:1px solid var(--line);outline:0}
.srch input:focus{border-color:var(--accent)}
.srch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.srch .res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:360px;overflow:auto;display:none;z-index:60;padding:6px}
.srch .res.open{display:block}
.srch .res button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:13px}
.srch .res button:hover,.srch .res button.hl{background:var(--card2)}
.icb{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink2);flex:0 0 38px;transition:background .15s,transform .1s}
.icb:hover{background:var(--card2)}
.icb:active{transform:scale(.95)}
.view{padding:24px 28px 90px;max-width:1240px;width:100%;margin:0 auto;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:15px;width:max-content;max-width:100%}
.subs button{padding:8px 15px;border-radius:11px;font-size:13.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.subs button:hover{color:var(--ink);background:var(--card2)}
.subs button.on{background:var(--btn);color:#fff;box-shadow:0 4px 12px rgba(94,64,117,.35)}
.subs .bd{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:10px;background:rgba(255,255,255,.18)}
.subs button:not(.on) .bd{background:var(--card3);color:var(--ink2)}
.fab{position:fixed;right:24px;bottom:24px;z-index:45;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#C9B3F0,#5E4075 60%,#45305A);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px rgba(69,48,90,.55),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s}
.fab:hover{transform:scale(1.06) rotate(90deg)}
.fab .ic{width:26px;height:26px;stroke-width:2.2}
.bnav{display:none}
.scrim{display:none}

/* ---------- generic ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.span2{grid-column:span 2}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow2);min-width:0;position:relative}
.card.glass{background:linear-gradient(160deg,color-mix(in srgb,var(--card2) 90%,transparent),var(--card))}
.card h3,.ch h3{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .ic{color:var(--accent)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:12px;background:var(--btn);color:var(--onbtn);font-weight:600;font-size:13.5px;border:1px solid transparent;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--btn2);box-shadow:0 6px 16px rgba(94,64,117,.35)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--card2);box-shadow:none}
.btn.soft{background:var(--card2);color:var(--ink);border-color:var(--line)}
.btn.soft:hover{background:var(--card3);box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 12%,transparent);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.lg{padding:13px 22px;font-size:15px;border-radius:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .ic{width:16px;height:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink2);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--card3);color:var(--ink2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,127,200,.18)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fld{margin-bottom:13px}
input[type=range]{width:100%;accent-color:var(--lav)}
input[type=checkbox]{accent-color:var(--lav);width:17px;height:17px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .orb{width:74px;height:74px;margin:0 auto 12px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:17px;margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kv:last-child{border-bottom:0}
.tip{font-size:12.5px;color:var(--muted);background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
.tip .ic{color:var(--accent);margin-top:1px}
.hr{height:1px;background:var(--line2);margin:14px 0}
.mt{margin-top:16px}.mt8{margin-top:8px}.mb{margin-bottom:16px}

/* ---------- stats ---------- */
.stat{display:flex;gap:13px;align-items:center}
.stat .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card3);color:var(--accent2);flex:0 0 44px}
.stat .si .ic{width:21px;height:21px}
.stat .v{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
button.card{text-align:left;cursor:pointer;transition:transform .15s,border-color .15s}
button.card:hover{transform:translateY(-2px);border-color:var(--accent)}

/* ---------- thought rows ---------- */
.list{display:flex;flex-direction:column;gap:7px}
.th{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;background:var(--card2);border:1px solid var(--line2);transition:border-color .15s,background .15s;min-width:0}
.th:hover{border-color:var(--line)}
.th .tb{flex:1;min-width:0}
.th .tt{font-size:14px;overflow-wrap:anywhere}
.th .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.th .acts{display:flex;gap:4px;flex:0 0 auto}
.th .acts button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.th .acts button:hover{background:var(--card3);color:var(--ink)}
.th .acts .ic{width:16px;height:16px}
.th.done .tt{text-decoration:line-through;color:var(--muted)}
.tdot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--accent);display:grid;place-items:center;flex:0 0 24px;transition:background .15s;color:transparent}
.ck:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ck.on{background:var(--good);border-color:var(--good);color:#fff}
.ck .ic{width:14px;height:14px;stroke-width:3}

/* ---------- 3D orbs (CSS spheres) ---------- */
.orb{border-radius:50%;position:relative;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),color-mix(in srgb,var(--c,#9B7FC8) 70%,#fff) 12%,var(--c,#9B7FC8) 42%,color-mix(in srgb,var(--c,#9B7FC8) 45%,#000) 100%);box-shadow:inset -8px -10px 22px rgba(0,0,0,.35),0 14px 26px color-mix(in srgb,var(--c,#9B7FC8) 35%,transparent)}
.orb::after{content:"";position:absolute;left:12%;right:12%;bottom:-16%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent);filter:blur(2px)}
.orbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.orbs button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;border-radius:14px;transition:background .15s}
.orbs button:hover{background:var(--card2)}
.orbs button:hover .orb{transform:translateY(-4px) scale(1.04)}
.orbs .orb{transition:transform .25s;animation:bob 4s ease-in-out infinite}
.orbs button:nth-child(2) .orb{animation-delay:-.7s}.orbs button:nth-child(3) .orb{animation-delay:-1.4s}.orbs button:nth-child(4) .orb{animation-delay:-2.1s}.orbs button:nth-child(5) .orb{animation-delay:-2.8s}.orbs button:nth-child(6) .orb{animation-delay:-3.5s}
.orbs .orb b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.orbs small{font-size:12px;color:var(--muted);font-weight:500}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ---------- mind sphere ---------- */
.sphere{position:relative;border-radius:var(--r);overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(94,64,117,.38),transparent 62%),linear-gradient(160deg,#21182B,#140E1A);border:1px solid var(--line);box-shadow:var(--shadow);min-height:360px}
html[data-theme="light"] .sphere{background:radial-gradient(circle at 50% 45%,rgba(155,127,200,.30),transparent 62%),linear-gradient(160deg,#FFFFFF,#EEE5FF)}
.sphere canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.sphere canvas:active{cursor:grabbing}
.sphere .ov{position:absolute;left:18px;top:16px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
.sphere .ov h3{font-size:19px;color:var(--ink)}
.sphere .ov .sub{max-width:280px}
.sphere .lg{position:absolute;left:14px;bottom:12px;right:14px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted);pointer-events:none}
.sphere .lg span{display:flex;align-items:center;gap:5px}
.sphere .hint{position:absolute;right:14px;bottom:12px;font-size:11px;color:var(--faint);pointer-events:none}
.sphere .tipbox{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 11px;border-radius:11px;font-size:12.5px;max-width:240px;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:3}
.sphere .tipbox.on{opacity:1;transform:none}
.sphere .tipbox small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.sphere .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.sphere .ctr b{display:block;font-family:var(--serif);font-size:40px;line-height:1;color:var(--ink);text-shadow:0 2px 18px rgba(94,64,117,.6)}
.sphere .ctr small{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- rings & gauges ---------- */
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .rc{position:absolute;text-align:center;line-height:1.1}
.ring .rc b{display:block;font-family:var(--serif);font-size:30px}
.ring .rc small{font-size:11.5px;color:var(--muted)}
.ring circle{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.gauge{position:relative;width:150px;height:150px;border-radius:50%;overflow:hidden;background:var(--card3);border:3px solid var(--line);box-shadow:inset 0 -10px 30px rgba(0,0,0,.25);margin:0 auto}
.gauge .lq{position:absolute;left:-50%;right:-50%;bottom:0;background:linear-gradient(180deg,#9B7FC8,#5E4075 60%,#45305A);transition:height .6s cubic-bezier(.2,.8,.2,1)}
.gauge .lq::before{content:"";position:absolute;left:50%;bottom:calc(100% - 7px);width:70%;aspect-ratio:1;transform:translateX(-50%) rotate(0);border-radius:42%;background:var(--card3);animation:wave 7s linear infinite}
@keyframes wave{to{transform:translateX(-50%) rotate(360deg)}}
.gauge .gv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);line-height:1}
.gauge .gv b{font-family:var(--serif);font-size:38px}
.gauge .gv small{display:block;font-size:11px;margin-top:4px;letter-spacing:.08em}
html[data-theme="light"] .gauge .gv{color:var(--ink)}
html[data-theme="light"] .gauge .gv b,html[data-theme="light"] .gauge .gv small{text-shadow:0 0 8px #fff,0 0 3px #fff}

/* ---------- timer ---------- */
.timer{display:flex;flex-direction:column;align-items:center;gap:14px}
.timer .ring .rc b{font-size:40px;font-variant-numeric:tabular-nums}
.presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* ---------- capture ---------- */
.cap{display:flex;gap:8px}
.cap input{font-size:15.5px;padding:13px 15px;border-radius:14px}
.cap .btn{padding:0 18px;border-radius:14px}
.prompt{padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,var(--royal),var(--violet));color:#fff;position:relative;overflow:hidden;min-height:94px}
.prompt::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.prompt small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.prompt p{font-family:var(--serif);font-size:19px;line-height:1.3;margin-top:5px;position:relative;z-index:1}
.prompt .row{margin-top:10px;position:relative;z-index:1}
.prompt .btn{background:rgba(255,255,255,.16);color:#fff}
.prompt .btn:hover{background:rgba(255,255,255,.26)}
.fly{position:fixed;z-index:90;pointer-events:none;width:14px;height:14px;border-radius:50%;transition:transform .7s cubic-bezier(.4,0,.2,1),opacity .7s}

/* ---------- sorting deck (3D) ---------- */
.deckwrap{display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px 0}
.deck{position:relative;width:min(560px,100%);aspect-ratio:1/1;max-height:560px}
.deck .stage{position:absolute;left:50%;top:50%;width:52%;height:40%;transform:translate(-50%,-50%);perspective:1200px;z-index:2}
.dcard{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .35s}
.dcard.flip{transform:rotateY(180deg)}
.dcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:18px;display:flex;flex-direction:column;background:linear-gradient(155deg,var(--card3),var(--card));border:1px solid var(--line);box-shadow:0 26px 50px rgba(5,0,10,.45),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
html[data-theme="light"] .dcard .face{background:linear-gradient(155deg,#fff,#F3EDFF);box-shadow:0 22px 44px rgba(69,48,90,.18)}
.dcard .back{transform:rotateY(180deg)}
.dcard .face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.dcard .tt{font-family:var(--serif);font-size:20px;line-height:1.3;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;overflow:auto}
.dcard .back .fld{margin-bottom:8px}
.dcard .back input,.dcard .back select{padding:7px 10px;font-size:13px}
.ghost1,.ghost2{position:absolute;inset:0;border-radius:20px;background:var(--card2);border:1px solid var(--line2);transform:translateY(10px) scale(.96);z-index:-1}
.ghost2{transform:translateY(20px) scale(.92);opacity:.6;z-index:-2}
.dcard.out-l{transform:translateX(-140%) rotate(-18deg);opacity:0}
.dcard.out-r{transform:translateX(140%) rotate(18deg);opacity:0}
.dcard.out-u{transform:translateY(-130%) scale(.8);opacity:0}
.dcard.in{animation:cardin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes cardin{from{transform:translateY(40px) scale(.9);opacity:0}}
.rt{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;line-height:1.15;text-align:center;background:var(--card);border:1px solid var(--line);color:var(--ink2);box-shadow:var(--shadow2);transition:transform .15s,background .15s,border-color .15s;z-index:3}
.rt:hover{transform:scale(1.08);border-color:var(--rc);background:color-mix(in srgb,var(--rc) 16%,var(--card))}
.rt .ic{width:22px;height:22px;color:var(--rc)}
.rt kbd{font:600 10px var(--sans);color:var(--faint)}
.orbit{position:absolute;inset:9%;border-radius:50%;border:1px dashed var(--line);pointer-events:none}
.orbit.o2{inset:22%;border-style:solid;border-color:var(--line2);animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dprog{display:flex;gap:5px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.dprog i{width:22px;height:6px;border-radius:4px;background:var(--card3)}
.dprog i.d{background:var(--lav)}.dprog i.c{background:var(--accent2);box-shadow:0 0 8px var(--lav)}

/* ---------- matrix ---------- */
.mx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.q{border-radius:var(--r);padding:14px;border:1px solid var(--line);background:var(--card);min-height:200px;transition:border-color .15s,background .15s}
.q.drop{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.q.arm{border-style:dashed;border-color:var(--accent);cursor:copy}
.q h4{font-family:var(--serif);font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.q h4 small{font-family:var(--sans);font-size:11.5px;color:var(--muted);font-weight:500;display:block}
.q .qn{font-family:var(--sans);font-size:12px;padding:2px 9px;border-radius:20px;background:var(--card3)}
.q .list{margin-top:10px}
.q .th{padding:7px 10px;cursor:grab}
.q1{box-shadow:inset 4px 0 0 #D55181}.q2{box-shadow:inset 4px 0 0 #9B6BE0}.q3{box-shadow:inset 4px 0 0 #C98500}.q4{box-shadow:inset 4px 0 0 #8E7A9B}
.th.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(155,127,200,.35)}

/* ---------- bubbles ---------- */
.bub{position:relative;width:100%;aspect-ratio:16/10;container-type:inline-size}
.bub button{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;transition:transform .2s;padding:4px;line-height:1.1}
.bub button:hover,.bub button.on{transform:scale(1.06);z-index:2}
.bub button.on{outline:3px solid var(--ink);outline-offset:3px}
.bub b{font-family:var(--serif);font-weight:600}
.bub small{font-size:11px;opacity:.92}

/* ---------- pick 3 ---------- */
.p3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.slot{border-radius:var(--r);padding:16px;background:var(--card);border:1px solid var(--line);min-height:170px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.slot .n{position:absolute;right:12px;top:4px;font-family:var(--serif);font-size:56px;font-weight:700;color:var(--card3);line-height:1;pointer-events:none}
.slot.empty{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);background:transparent}
.slot.done{background:linear-gradient(160deg,color-mix(in srgb,var(--good) 18%,var(--card)),var(--card))}
.slot .tt{font-family:var(--serif);font-size:17px;line-height:1.3;padding-right:40px;overflow-wrap:anywhere;position:relative}
.slot.done .tt{text-decoration:line-through;opacity:.7}
.steps{display:flex;flex-direction:column;gap:5px}
.steps label{display:flex;gap:8px;align-items:center;font-size:13px}
.steps label.d span{text-decoration:line-through;color:var(--muted)}

/* ---------- dopamine menu ---------- */
.menu{background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;padding:26px;position:relative;box-shadow:var(--shadow)}
.menu::before{content:"";position:absolute;inset:9px;border:1px solid var(--line);border-radius:16px;pointer-events:none}
.menu .mh{text-align:center;margin-bottom:18px}
.menu .mh h2{font-size:32px;font-style:italic}
.menu .mh small{letter-spacing:.3em;text-transform:uppercase;font-size:10.5px;color:var(--muted)}
.course h4{font-family:var(--serif);font-size:19px;display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.course h4::after{content:"";flex:1;border-bottom:1px dotted var(--line)}
.course p.d{font-size:12px;color:var(--muted);margin-bottom:8px}
.course ul{list-style:none;display:flex;flex-direction:column;gap:2px}
.course li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;font-size:13.5px}
.course li:hover{background:var(--card3)}
.course li span{flex:1;overflow-wrap:anywhere}
.course li .x{opacity:0;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.course li:hover .x{opacity:1}
.course li .x .ic{width:14px;height:14px}
.course li .n{font-size:11px;color:var(--faint)}
.spin{font-family:var(--serif);font-size:26px;text-align:center;min-height:70px;display:grid;place-items:center;padding:8px}

/* ---------- breathing orb (3D) ---------- */
.breath{position:relative;width:260px;height:260px;margin:10px auto;perspective:800px}
.breath .core{position:absolute;inset:25%;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff,#E1D2FF 12%,#9B7FC8 45%,#45305A 100%);box-shadow:0 0 60px rgba(155,127,200,.6),inset -10px -14px 30px rgba(0,0,0,.35);transition:transform 4s ease-in-out}
.breath .rg{position:absolute;inset:8%;border-radius:50%;border:2px solid rgba(155,127,200,.55);transform-style:preserve-3d;animation:rg 9s linear infinite}
.breath .rg:nth-child(2){animation-duration:13s;inset:4%;border-color:rgba(231,219,239,.35)}
.breath .rg:nth-child(3){animation-duration:17s;animation-direction:reverse;inset:14%;border-color:rgba(94,64,117,.6)}
@keyframes rg{from{transform:rotateX(68deg) rotateZ(0)}to{transform:rotateX(68deg) rotateZ(360deg)}}
.breath .bl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none}
.breath .bl b{font-family:var(--serif);font-size:24px;display:block}
.breath .bl small{font-size:13px}

/* ---------- charts ---------- */
.chart{position:relative}
.chart svg{width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--line2);stroke-width:1}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart [data-tip]{cursor:pointer}
.chart .hit{fill:transparent}
.legend{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{flex:0 0 auto}
.donut .dl{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px}
.donut .dl div{display:flex;align-items:center;gap:8px;font-size:13px}
.donut .dl b{margin-left:auto;font-variant-numeric:tabular-nums}
#tt{position:fixed;z-index:200;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;max-width:260px;white-space:pre-line}
#tt.on{opacity:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:4px;max-width:640px}
.heat i{width:100%;height:15px;border-radius:4px;background:var(--card3);display:block}
.cloud{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:center;padding:6px}
.cloud span{font-family:var(--serif);line-height:1.2;color:var(--accent2)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdg{border-radius:16px;padding:16px 12px;text-align:center;background:var(--card2);border:1px solid var(--line2)}
.bdg .orb{width:54px;height:54px;margin:0 auto 10px;display:grid;place-items:center;color:#fff}
.bdg .orb .ic{width:24px;height:24px;position:relative;z-index:1}
.bdg b{display:block;font-size:13.5px}
.bdg small{font-size:11.5px;color:var(--muted)}
.bdg.lock{opacity:.45;filter:grayscale(.9)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .dh{font-size:11px;color:var(--muted);font-weight:600;padding:4px 0}
.cal button{aspect-ratio:1;border-radius:10px;font-size:12.5px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card2)}
.cal button:hover{background:var(--card3)}
.cal button.o{opacity:.35}
.cal button.td{outline:2px solid var(--accent)}
.cal button.on{background:var(--btn);color:#fff}
.cal button i{display:flex;gap:2px}
.cal button i s{width:5px;height:5px;border-radius:50%;background:var(--lav);display:block}

/* ---------- review ---------- */
.rv{display:flex;gap:12px;padding:13px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);align-items:flex-start}
.rv.d{opacity:.65}
.rv .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card3);font-weight:700;font-size:13px;flex:0 0 30px}
.rv.d .n{background:var(--good);color:#fff}
.rv b{display:block;font-size:14px}
.rv p{font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- modal & toast ---------- */
.mdl{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(10,3,16,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.mdl .box{width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.mdl .box.w{width:min(760px,100%)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.mdl .mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mdl .mh h2{font-size:21px}
.mdl .mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--btn);border-color:var(--btn);color:#fff}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;box-shadow:var(--shadow);font-size:13.5px;font-weight:500;animation:pop .25s;max-width:min(92vw,460px)}
.toast button{color:var(--lav);font-weight:700}
html[data-theme="light"] .toast button{color:#5E4075}
#fx{position:fixed;inset:0;pointer-events:none;z-index:180}
.welcome .orb{width:90px;height:90px;margin:4px auto 14px}
.welcome .wl{width:96px;height:96px;border-radius:24px;margin:2px auto 14px;display:block;box-shadow:0 12px 28px rgba(69,48,90,.35)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.steps3 div{padding:12px;border-radius:14px;background:var(--card2);text-align:center;font-size:12.5px;color:var(--muted)}
.steps3 b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink);margin:4px 0 2px}
.steps3 .ic{margin:0 auto;color:var(--accent);width:22px;height:22px}
.ai{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kb{font:600 11px var(--sans);padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:var(--card2)}

/* ---------- responsive ---------- */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.srch{width:200px}}
@media (max-width:980px){
  .side{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,3,16,.5);z-index:39}
  .top .burger{display:grid}
  .g21,.g12,.g3{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .top{padding:12px 16px}
  .view{padding:18px 16px 110px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:44;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:5px 0;border-radius:10px}
  .bnav button.on{color:var(--accent2);background:var(--card2)}
  .fab{bottom:84px;right:16px;width:54px;height:54px}
  .toasts{bottom:150px}
}
@media (max-width:720px){
  .g2,.g4,.mx,.p3{grid-template-columns:minmax(0,1fr)}
  .srch{display:none}
  .top h1{font-size:20px}
  .orbs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .subs{width:100%;flex-wrap:nowrap;overflow-x:auto}
  .deck{aspect-ratio:auto;max-height:none;display:flex;flex-direction:column;gap:12px}
  .deck .stage{position:relative;left:auto;top:auto;transform:none;width:100%;height:260px}
  .deck .orbit{display:none}
  .deck .rts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .rt{position:static;margin:0;width:auto;height:auto;aspect-ratio:1;border-radius:18px;font-size:10.5px}
  .menu{padding:18px}
  .steps3{grid-template-columns:1fr}
  .sphere{min-height:320px}
  .card{padding:15px}
}
@media (max-width:380px){.deck .rts{grid-template-columns:repeat(3,minmax(0,1fr))}.top .icb.hide-xs{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}

/* ---------- print ---------- */
#print{display:none}
@media print{
  body::before,.side,.top,.fab,.bnav,.toasts,#app,.mdl{display:none!important}
  body{background:#fff;color:#000}
  #print{display:block;padding:10px;font-family:var(--sans)}
  #print h1{font-size:22px;margin-bottom:4px}
  #print h2{font-size:15px;margin:16px 0 6px;border-bottom:1px solid #999;padding-bottom:3px}
  #print li{margin:3px 0 3px 18px;font-size:12px}
}

/* ================= Debt Payoff Tracker additions ================= */
.dic{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));box-shadow:0 4px 10px color-mix(in srgb,var(--c) 35%,transparent)}
.dic .ic{width:17px;height:17px}
.kick{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bigdate{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1;margin:4px 0 6px;color:var(--ink)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.badp{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.warnp{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.kind{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent2)}
.pill .ic{width:13px;height:13px}
.goodt{color:var(--good)}.badt{color:var(--bad)}
.free{background:linear-gradient(150deg,color-mix(in srgb,var(--lilac) 55%,var(--card)),var(--card))}
html[data-theme="dark"] .free{background:linear-gradient(150deg,#3A2950,var(--card))}
.tw canvas{cursor:grab}
.tw .tipbox b{display:block}
.orow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line2)}
.orow .on{width:24px;height:24px;border-radius:8px;background:var(--card3);display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 24px}
.orow .on .ic{width:14px;height:14px;color:var(--good)}
.orow .tb{flex:1;min-width:0}.orow .tt{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .bar{margin-top:6px;height:6px}
.orow.done{opacity:.75}
.orow[draggable="true"]{cursor:grab}
.icb.sm{width:30px;height:30px;flex:0 0 30px;border-radius:9px}
.icb:disabled{opacity:.35}
.sumbar{display:flex;gap:8px;flex-wrap:wrap}
.sumbar span{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:8px 13px;display:flex;flex-direction:column}
.sumbar small{font-size:11px;color:var(--muted)}.sumbar b{font-family:var(--serif);font-size:18px}
.debtcard{border-top:4px solid var(--c)}
.debtcard .dn{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.debtcard .big{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.debtcard.paid{background:linear-gradient(160deg,color-mix(in srgb,var(--good) 12%,var(--card)),var(--card))}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.facts span{background:var(--card2);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;min-width:0}
.facts small{font-size:10.5px;color:var(--muted)}.facts b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;border-radius:12px;padding:9px 11px;background:var(--card2);border:1px solid var(--line)}
.note.warn{background:color-mix(in srgb,var(--warn) 12%,var(--card));border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.note .ic{color:var(--warn);margin-top:1px}
.strat{text-align:left}
.strat.on{border-color:var(--accent);box-shadow:var(--glow)}
.strat .si{width:34px;height:34px;border-radius:11px;background:var(--card3);display:grid;place-items:center;color:var(--accent2)}
.strat b{font-size:15px}
.sres{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.sres span{background:var(--card2);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column}
.sres small{font-size:10.5px;color:var(--muted)}.sres b{font-family:var(--serif);font-size:17px}
.cur{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 10px;transition:border-color .15s,box-shadow .15s}
.cur:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,127,200,.2)}
.cur span{color:var(--muted);font-weight:600;font-size:13.5px}
.cur input{border:0!important;background:transparent!important;box-shadow:none!important;padding:10px 6px!important;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr.on td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.tbl td.off{background:color-mix(in srgb,var(--good) 13%,transparent);font-weight:600}
.tblwrap{overflow:auto;max-height:560px;border:1px solid var(--line2);border-radius:12px}
.tbl.sch th{position:sticky;top:0;background:var(--card);z-index:1}
.tbl.sch td{white-space:nowrap;font-variant-numeric:tabular-nums}
.gantt{display:flex;flex-direction:column;gap:9px}
.grow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center}
.gl{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}.gl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt{position:relative;height:22px;background:var(--card2);border-radius:8px}
.gt i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;opacity:.9}
.gt .ge{position:absolute;top:50%;transform:translate(6px,-50%);font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap}
.grow.ax .gt{background:none;height:16px}.grow.ax .gt span{position:absolute;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap}
.gh{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px;font-weight:600}
.wv{font-family:var(--serif);font-size:24px;min-width:90px}
.wres .hl,.vs .hl{background:color-mix(in srgb,var(--lilac) 45%,var(--card));border-radius:14px;padding:10px 12px}
html[data-theme="dark"] .wres .hl,html[data-theme="dark"] .vs .hl{background:#3A2950}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.vs>div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--card2)}
.vs small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.vs b{font-family:var(--serif);font-size:20px}.vs span{font-size:12.5px;color:var(--muted)}
.g100{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:12px}
.g100 i{aspect-ratio:1;border-radius:4px;background:var(--card3);border:1px solid var(--line2);display:block}
.g100 i.f{background:var(--c);border-color:transparent;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.mile{padding:12px;border-radius:14px;background:var(--card2);margin-top:10px}.mile b{display:block}.mile .bar{margin-top:8px}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 30px;gap:8px;align-items:center}
.stack{display:flex;height:22px;border-radius:10px;overflow:hidden;gap:2px;background:var(--card3)}
.stack i{display:block;height:100%}
.kv.tot{border-top:2px solid var(--line);margin-top:4px;padding-top:10px}
.idea{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:11px;background:var(--card2);font-size:13.5px;cursor:pointer}
.idea.d span{text-decoration:line-through;color:var(--muted)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.paidbadge{width:84px;height:84px;margin:0 auto;border-radius:26px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 14px 30px color-mix(in srgb,var(--c) 40%,transparent)}
.paidbadge .ic{width:40px;height:40px}
.hero{padding:30px;background:linear-gradient(150deg,color-mix(in srgb,var(--lilac) 60%,var(--card)),var(--card))}
html[data-theme="dark"] .hero{background:linear-gradient(150deg,#3A2950,var(--card))}
.heroart{display:flex;align-items:flex-end;gap:12px;height:150px;padding:0 10px;perspective:400px}
.heroart i{width:42px;border-radius:8px 8px 4px 4px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 70%,#000) 0 30%,var(--c) 30%);box-shadow:0 10px 18px color-mix(in srgb,var(--c) 35%,transparent);transform:rotateY(-14deg)}
.top .btn.hide-sm{margin-right:4px}
@media (max-width:980px){.grow{grid-template-columns:110px minmax(0,1fr)}}
@media (max-width:720px){.top .btn.hide-sm{display:none}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.bigdate{font-size:24px}.vs{grid-template-columns:1fr}.heroart{display:none}.sumbar span{flex:1;min-width:120px}.brow{grid-template-columns:minmax(0,1fr) 110px 30px}}

.gt .ge.in{transform:translate(calc(-100% - 7px),-50%);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.free .pill{white-space:normal}

.tw .lg{right:150px}
.tw .hint{bottom:12px}
@media (max-width:720px){.tw .lg{right:14px;bottom:30px}}
@media (max-width:720px){.tw{min-height:460px!important;height:460px}.tw .ov .sub{font-size:12px}}
.debtcard{container-type:inline-size}
.debtcard .big{font-size:clamp(17px,10.5cqw,26px);overflow-wrap:anywhere}
.tw canvas{position:absolute;inset:0}
select{max-width:100%}
.ch select{min-width:0;max-width:220px}
input[type=month]{width:100%;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);outline:0;color:var(--ink);color-scheme:inherit}
input[type=month]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,127,200,.18)}
/* ============ DEMO bar ============ */
:root{--demo-h:48px}
body.is-demo{padding-top:var(--demo-h)}
.demo-bar{position:fixed;top:0;left:0;right:0;height:var(--demo-h);z-index:90;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(90deg,#45305A 0%,#5E4075 65%,#9B7FC8 100%);color:#F6F1FF;font-family:var(--sans);font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(69,48,90,.3);white-space:nowrap;overflow:hidden}
.demo-badge{flex-shrink:0;background:#F6F1FF;color:#45305A;font-size:11px;font-weight:800;letter-spacing:1.5px;padding:4px 9px;border-radius:7px}
.demo-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.demo-txt b{font-weight:700;color:#fff}
.demo-long{opacity:.85}
.demo-meter{display:flex;align-items:center;gap:8px;flex-shrink:0}
.demo-count{font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
.demo-track{width:96px;height:7px;border-radius:9px;background:rgba(245,235,250,.25);overflow:hidden}
.demo-track span{display:block;height:100%;width:0;background:#F6F1FF;border-radius:9px;transition:width .4s ease}
.demo-bar.full .demo-track span{background:#F7A7BA}
.demo-buy{flex-shrink:0;background:#F6F1FF;color:#45305A;text-decoration:none;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.2);transition:transform .15s}
.demo-buy:hover{transform:translateY(-1px)}
.demo-buy:focus-visible{outline:2px solid #F6F1FF;outline-offset:2px}
.demo-buy-short{display:none}
body.is-demo .side{top:var(--demo-h);height:calc(100vh - var(--demo-h))}
body.is-demo .top{top:var(--demo-h)}
.demo-up p{line-height:1.6}
.demo-up ul{margin:6px 0 12px 18px;line-height:1.8;font-size:13.5px}
.mdl a.btn{text-decoration:none}
@media(max-width:1180px){.demo-long{display:none}}
@media(max-width:980px){body.is-demo .side{top:var(--demo-h);height:calc(100vh - var(--demo-h))}}
@media(max-width:640px){
 :root{--demo-h:46px}
 .demo-bar{gap:9px;padding:0 10px;font-size:12px}
 .demo-txt{display:none}
 .demo-meter{flex:1}
 .demo-track{flex:1;width:auto;max-width:170px}
 .demo-buy{padding:7px 11px;font-size:12px}
 .demo-buy-long{display:none}.demo-buy-short{display:inline}
}
@media print{.demo-bar{display:none!important}body.is-demo{padding-top:0}}
</style>
